# Automated Integration Prototype - IP Definition: RTC v1
# Contains all patch instructions required to integrate this peripheral into the SoC for gc2025 (Shakti).
# Location: gc2025/hw/ip_bsv/rtc_v1/rtc_v1.yaml
#
# NOTE: All file paths are relative to gc2025/hw/ and target the board directory.
# Default board: nexys_video. Change BOARD variable in Makefile or context below for other boards.
#
# NAMING CONVENTIONS (auto-generated by peripheral_registry.py):
# - rtc_instance_name      : e.g., "rtc0", "rtc1"
# - rtc_io_interface_name  : e.g., "rtc0_io", "rtc1_io"
# - rtc_io_inst_name       : e.g., "rtc0_io_inst", "rtc1_io_inst"
# - rtc_io_port_name       : e.g., "rtc0_io_rtc_clock_signal"
# - verilog_wire_name      : e.g., "wire_rtc0_out"
# - verilog_port_name      : e.g., "rtc0_out_pmod"
# These are generated from instance_id. Override in soc_build_config.yaml if custom names are needed.

name: "rtc_v1"
yaml_version: "2.0"
# Unified with/without-IO def. no_io = PLIC-connected RTC with no chip pin.
# def_path configs get this default; declare `modes:` + rtc_mode to pick no_io.
default_mode: "with_io"
description: "48-bit high-precision RTC with  32kHz crystal oscillator source andCDC handshake"

# =============================================================================
# ANCHORS: Reusable, instance-agnostic injection points
# =============================================================================
anchors:
  # === BSV INCLUDE PATH ===
  bsvpath_tcm:
    file: "bsvpath"
    pattern: '^devices/tcm$'
    position: "after"
  
  # === SOC.DEFINES: Memory Map ===
  soc_defines_memory:
    file: "{board_dir}/Soc.defines"
    # RTC0/RTC1 ('h0004_0600/0700) used to anchor on GPTimer3End -- the SAME line
    # gptimer4 and watchdog anchor on, so all three piled up there and their text
    # order was just the reverse of the apply order. Each now owns a distinct
    # pristine anchor, so the address block is deterministic and tidy.
    pattern: '^`define PinmuxEnd\s+''h0004_15FF'
    position: "after"
  
  # === SOC.DEFINES: MixedCluster_Num_Slaves Update ===
  soc_defines_num_slaves:
    file: "{board_dir}/Soc.defines"
    pattern: '^`define\s+MixedCluster_Num_Slaves\s+\d+'
    position: "replace"
  
  # === SOC.DEFINES: MixedCluster_err_slave_num Update ===
  soc_defines_err_slave:
    file: "{board_dir}/Soc.defines"
    pattern: '^`define\s+MixedCluster_err_slave_num\s+\d+'
    position: "replace"
  
  # === MIXED_CLUSTER.BSV: Import Statement ===
  mixed_cluster_import_pinmux:
    file: "{board_dir}/mixed_cluster.bsv"
    pattern: '^\s*import pinmux_axi4lite\s::\s\*\s;'
    position: "after"
  
  # === MIXED_CLUSTER.BSV: Interface Declaration ===
  mixed_cluster_interface_decl:
    file: "{board_dir}/mixed_cluster.bsv"
    pattern: '^\s*interface Ifc_mixed_cluster;'
    position: "after"
  
  # === MIXED_CLUSTER.BSV: Address Decoder ===
  mixed_cluster_addr_decoder:
    file: "{board_dir}/mixed_cluster.bsv"
    pattern: 'slave_num = `Pinmux_slave_num;'
    position: "after"
  
  # === MIXED_CLUSTER.BSV: Module Instantiation ===
  mixed_cluster_instantiation:
    file: "{board_dir}/mixed_cluster.bsv"
    pattern: '^\s*let pinmuxtop <- mkpinmuxtop\(\);'
    position: "after"
  
  # === MIXED_CLUSTER.BSV: AXI Connection ===
  mixed_cluster_axi_conn:
    file: "{board_dir}/mixed_cluster.bsv"
    pattern: 'mkConnection \(fabric\.v_to_slaves \[`Pinmux_slave_num \], pinmuxtop\.slave\);'
    position: "after"
  
  # === MIXED_CLUSTER.BSV: mkpinmuxtop Wrapper (NEW) ===
  mixed_cluster_wrapper:
    file: "{board_dir}/mixed_cluster.bsv"
    pattern: '\(\*synthesize\*\)\s*\n\s*module mkpinmuxtop\(Ifc_pinmux_axi4lite#\(`paddr, `buswidth, `USERSPACE\)\);\s*\n\s*let ifc\(\);\s*\n\s*mkpinmux_axi4lite _temp\(ifc\);\s*\n\s*return ifc;\s*\n\s*endmodule'
    position: "after"
    multiline: true
  
  # === MIXED_CLUSTER.BSV: Interface Wiring ===
  mixed_cluster_interface_wire:
    file: "{board_dir}/mixed_cluster.bsv"
    pattern: '^\s*interface gptimer3_io = gptimer3\.io;'
    position: "after"
  
  # === MIXED_CLUSTER.BSV: PLIC Vector Automation (Special Handler) ===
  # ---- mixed_cluster.bsv: PLIC vector -- INSERT into this IP's group ----
  # rtc has no family, so it sits at the MSB with the other discrete sources.
  # reverse_instances -> rtc1 above rtc0 (descending, MSB-first).
  mixed_cluster_plic_vector:
    file: "{board_dir}/mixed_cluster.bsv"
    pattern: '^\s*// ---- discrete PLIC sources \(added by automation\) ----'
    position: "after"
  
  # === MIXED_CLUSTER.BSV: mkplic Wrapper Width ===

  # NOTE: rtc's interrupts are DISCRETE PLIC signals (rtc0/rtc1.rtc_sb_interrupt);
  # rtc does NOT touch the interrupt-bus width. The Bit#(13)->Bit#(14) bus
  # widening (and its wr_external_interrupts[13] PLIC bit) belongs to UART3,
  # which is what actually needs the extra bus bit — see uart_v1. This keeps
  # rtc self-contained: it compiles standalone and in any combination.

  # === SOC.BSV: Import Statement ===
  soc_bsv_import_gptimer:
    file: "{board_dir}/Soc.bsv"
    pattern: '^\s*import gptimer::\*;'
    position: "after"
  
  # === SOC.BSV: Interface Declaration ===
  soc_bsv_interface_decl:
    file: "{board_dir}/Soc.bsv"
    pattern: 'interface Ifc_gptimer_io gptimer3_io;'
    position: "after"
  
  # === SOC.BSV: Interface Wiring ===
  soc_bsv_interface_wire:
    file: "{board_dir}/Soc.bsv"
    pattern: 'interface gptimer3_io = mixed_cluster\.gptimer3_io;'
    position: "after"
  
  # === FPGA_TOP.V: Top-Level Port Declaration ===
  fpga_top_port_decl:
    file: "{board_dir}/fpga_top.v"
    pattern: '// ---- direct-connected peripheral ports \(added by automation\) ----'
    position: "after"
  
  # === FPGA_TOP.V: Internal Wire Declaration ===
  fpga_top_wire_decl:
    file: "{board_dir}/fpga_top.v"
    pattern: '   wire\s+ip2intc_irpt;'
    position: "before"
  
  # === FPGA_TOP.V: SoC Instantiation Port Mapping ===
  fpga_top_soc_inst:
    file: "{board_dir}/fpga_top.v"
    pattern: '\.ext_interrupts_i\(interrupts\),?'
    position: "after"
  
  # === FPGA_TOP.V: IOBUF Instantiation ===
  fpga_top_iobuf:
    file: "{board_dir}/fpga_top.v"
    pattern: 'IOBUF spi0_inst_sclk\(.O\(spi0_io_sclk_in_val\) ,.IO\(spi0_sclk\) ,.I\(spi0_io_sclk_out\) ,.T\(~spi0_io_sclk_outen\)\);'
    position: "after"
  
  # === XDC CONSTRAINTS: Pin Assignment ===
  xdc_pin_assign:
    type: "xdc_pin_assign"
    file: "{xdc_file}"
    # Structural anchor: no regex pattern; validated by handler

# =============================================================================
# PATCHES: Instance-aware injections that reference anchors
# =============================================================================
  # ---- Soc.defines: derived PLIC width (UserManual Section 21) ----
  soc_defines_plic_width:
    file: "{board_dir}/Soc.defines"
    pattern: '^`define\s+PLICWidth\s+\d+'
    position: "replace"

patches:
  # === Soc.defines: grow `PLICWidth by this IP's discrete PLIC signal count ===
  # `PLICWidth is no longer rewritten by the plic_vector handler; it is DERIVED
  # in Soc.defines and each contributing IP bumps it by its instance count.
  # Guarded on `RTC0Base, which the soc_defines_memory patch writes -- so this
  # counter is listed FIRST and still sees a pristine Soc.defines on a first run.
  - anchor_ref: "soc_defines_plic_width"
    plic_gated: true   # connect_to_plic gate (skipped when false)
    code: "`define PLICWidth {calculated_val}"
    skip_if_contains: "`define RTC0Base"
    apply_once: true
    type: "cluster_config"
    target_macro: "PLICWidth"
    increment_by_instances: true

  # === 1. BSV INCLUDE PATH (shared across all instances) ===
  - anchor_ref: "bsvpath_tcm"
    code: "ip_bsv/rtc_v1/"
    skip_if_contains: "ip_bsv/rtc_v1/"
    apply_once: true
  
  # === 2. SOC.DEFINES: Memory Map (instance-specific) ===
  - anchor_ref: "soc_defines_memory"
    code: |
      {base_macro}    'h{base_addr}
      {end_macro}     'h{end_addr}
    skip_if_contains: "`define {base_macro}"
    instance_aware: true
  
  # === 3. SOC.DEFINES: MixedCluster_Num_Slaves Update (global counter) ===
  # skip uses the per-instance slave_id macro: {calculated_val} is only known
  # at apply time, so a skip built from it can never match and every re-run
  # would increment the counter again.
  - anchor_ref: "soc_defines_num_slaves"
    code: "`define MixedCluster_Num_Slaves {calculated_val}"
    skip_if_contains: "`define {slave_id_macro}"
    apply_once: true
    type: "cluster_config"
    target_macro: "MixedCluster_Num_Slaves"
    increment_by_instances: true
  
  # === 4. SOC.DEFINES: MixedCluster_err_slave_num Update ===
  - anchor_ref: "soc_defines_err_slave"
    code: |
      `define {slave_id_macro} {allocated_slot}
      `define MixedCluster_err_slave_num {calculated_val}
    skip_if_contains: "`define {slave_id_macro}"
    type: "cluster_config"
    target_macro: "MixedCluster_err_slave_num"
    increment_by_instances: true
    apply_once: true

  # === 5. MIXED_CLUSTER.BSV: Import Statement (shared) ===
  - anchor_ref: "mixed_cluster_import_pinmux"
    code: "import rtc_v1 :: *;"
    skip_if_contains: "import rtc_v1"
    apply_once: true
    indent_context: "package_body"

  # === 6. MIXED_CLUSTER.BSV: Interface Declaration (instance-specific) ===
  - anchor_ref: "mixed_cluster_interface_decl"
    mode: with_io
    code: |
      (*always_ready, always_enabled*)
      interface RTCIO {rtc_io_interface_name};
    skip_if_contains: "interface RTCIO {rtc_io_interface_name}"
    instance_aware: true
    indent_context: "interface_body"

  # === 7. MIXED_CLUSTER.BSV: Address Decoder (instance-specific) ===
  - anchor_ref: "mixed_cluster_addr_decoder"
    code: |
      else if(addr >= `{base_macro} && addr <= `{end_macro})
        slave_num = `{slave_id_macro};
    skip_if_contains: "`{base_macro}"
    instance_aware: true
    indent_context: "function_body"

  # === 8. MIXED_CLUSTER.BSV: Module Instantiation (instance-specific) ===
  - anchor_ref: "mixed_cluster_instantiation"
    code: |
      let {rtc_instance_name} <- mkrtc(ext_clk);
    skip_if_contains: "let {rtc_instance_name} <- mkrtc"
    instance_aware: true
    indent_context: "module_body"

  # === 9. MIXED_CLUSTER.BSV: AXI Connection (instance-specific) ===
  - anchor_ref: "mixed_cluster_axi_conn"
    code: |
      mkConnection (fabric.v_to_slaves [`{slave_id_macro} ], {rtc_instance_name}.slave);
    skip_if_contains: "[`{slave_id_macro} ]"
    instance_aware: true
    indent_context: "module_body"

  # === 10. MIXED_CLUSTER.BSV: mkpinmuxtop Wrapper (shared) ===
  - anchor_ref: "mixed_cluster_wrapper"
    code: |
      (*synthesize*)
      module mkrtc#(Clock ext_clk)(Ifc_rtc_axi4lite#(`paddr, `buswidth, `USERSPACE));
        let ifc();
        mkrtc_axi4lite#(ext_clk) _temp(ifc);
        return ifc;
      endmodule
    skip_if_contains: "module mkrtc#(Clock ext_clk)"
    apply_once: true
    blank_line_before: true
    indent_context: "package_body"

  # === 11. MIXED_CLUSTER.BSV: Interface Wiring (instance-specific) ===
  - anchor_ref: "mixed_cluster_interface_wire"
    mode: with_io
    code: |
      interface {rtc_io_interface_name} = {rtc_instance_name}.io;
    skip_if_contains: "interface {rtc_io_interface_name} = {rtc_instance_name}.io"
    instance_aware: true
    indent_context: "module_body"
  
  # === 12. MIXED_CLUSTER.BSV: PLIC Vector Automation (instance-aware, special handler) ===
  - anchor_ref: "mixed_cluster_plic_vector"
    plic_gated: true   # connect_to_plic gate (skipped when false)
    code: "{plic_source},"
    skip_if_contains: "{plic_source},"
    instance_aware: true
    reverse_instances: true
  
  # === 13. MIXED_CLUSTER.BSV: mkplic Wrapper Width (global, calculated by handler) ===

  # NOTE: the interrupt-bus widening (Bit#(13)->Bit#(14)) and its
  # wr_external_interrupts[13] PLIC bit were moved to uart_v1 — that bit exists
  # for UART3, not RTC. rtc adds only its own discrete rtc_sb_interrupt signals
  # above, so it is fully self-contained (compiles alone and in any combo).

  # === 14. SOC.BSV: Import Statement (shared) ===
  - anchor_ref: "soc_bsv_import_gptimer"
    code: "import rtc_v1 :: *;"
    skip_if_contains: "import rtc_v1"
    apply_once: true
    indent_context: "package_body"

  # === 15. SOC.BSV: Interface Declaration (instance-specific) ===
  - anchor_ref: "soc_bsv_interface_decl"
    mode: with_io
    code: |
      (*always_ready, always_enabled*)
      interface RTCIO {rtc_io_interface_name};
    skip_if_contains: "interface RTCIO {rtc_io_interface_name}"
    instance_aware: true
    indent_context: "interface_body"

  # === 16. SOC.BSV: Interface Wiring (instance-specific) ===
  - anchor_ref: "soc_bsv_interface_wire"
    mode: with_io
    code: |
      interface {rtc_io_interface_name} = mixed_cluster.{rtc_io_interface_name};
    skip_if_contains: "interface {rtc_io_interface_name} = mixed_cluster.{rtc_io_interface_name}"
    instance_aware: true
    indent_context: "module_body"
  
  # === 17. FPGA_TOP.V: Top-Level Port Declaration (instance-specific) ===
  - anchor_ref: "fpga_top_port_decl"
    mode: with_io
    code: |
      output {verilog_port_name},
    skip_if_contains: "output {verilog_port_name}"
    instance_aware: true
  
  # === 18. FPGA_TOP.V: Internal Wire Declaration (instance-specific) ===
  - anchor_ref: "fpga_top_wire_decl"
    mode: with_io
    code: |
      wire {verilog_wire_name};
    skip_if_contains: "wire {verilog_wire_name};"
    instance_aware: true
  
  # === 19. FPGA_TOP.V: SoC Instantiation Port Mapping ===
  - anchor_ref: "fpga_top_soc_inst"
    mode: with_io
    code: |
      .{rtc_io_port_name}({verilog_wire_name}),
    skip_if_contains: ".{rtc_io_port_name}({verilog_wire_name})"
    instance_aware: true
    position: "after" 
    strip_last_trailing_comma: true 
  
  # === 20. FPGA_TOP.V: IOBUF Instantiation (instance-specific) ===
  - anchor_ref: "fpga_top_iobuf"
    mode: with_io
    code: |
      {verilog_buffer_type} {rtc_io_inst_name}(.O(),.IO({verilog_port_name}),.I({verilog_wire_name}),.T({verilog_buffer_tristate}));
    skip_if_contains: "{rtc_io_inst_name}"
    instance_aware: true
  
  # === 21. XDC CONSTRAINTS: Pin Assignment with Conflict Resolution (instance-specific) ===
  - anchor_ref: "xdc_pin_assign"
    mode: with_io
    port_name: "{verilog_port_name}"
    target_board_pin: "{pin_hint}"
    fallback_pin: "{fallback_pin}"
    io_standard: "LVCMOS12"
    skip_if_contains: "get_ports {verilog_port_name}"
    instance_aware: true
    type: "xdc_pin_assign"

# =============================================================================
# ANCHOR REFERENCE (for --pre-audit / --post-audit)
# Run: make pre-audit   (before automation)
# Run: make post-audit  (after automation)
# =============================================================================
#
# PRE-AUDIT ANCHORS (must exist in {board_dir}/ or hw/ root in fresh clone):
#   bsvpath:                          "^devices/tcm$"
#   {board_dir}/Soc.defines:          "^`define GPTimer3End\s+'h0004_05FF"
#   {board_dir}/Soc.defines:          "`define MixedCluster_Num_Slaves 11"
#   {board_dir}/Soc.defines:          "^`define MixedCluster_err_slave_num 10"
#   {board_dir}/Soc.bsv:              "import gptimer::\*;"
#   {board_dir}/mixed_cluster.bsv:    "import pinmux_axi4lite :: \*;"
#   {board_dir}/mixed_cluster.bsv:    "interface Ifc_mixed_cluster;"
#   {board_dir}/mixed_cluster.bsv:    "slave_num = `Pinmux_slave_num;"
#   {board_dir}/mixed_cluster.bsv:    "let pinmuxtop <- mkpinmuxtop\(\);"
#   {board_dir}/mixed_cluster.bsv:    "(\*synthesize\*)\s*\n\s*module mkpinmuxtop.*\n\s*endmodule" (multiline block)
#   {board_dir}/mixed_cluster.bsv:    "Bit#(35) plic_inputs= {" (width may vary)
#   {board_dir}/mixed_cluster.bsv:    "module mkplic\(Ifc_plic_axi4lite#\(`paddr, `buswidth, `USERSPACE,\s*\d+"
#   {board_dir}/mixed_cluster.bsv:    "mkConnection \(fabric\.v_to_slaves \[`Pinmux_slave_num \], pinmuxtop\.slave\);"
#   {board_dir}/mixed_cluster.bsv:    "interface gptimer3_io = gptimer3\.io;"
#   {board_dir}/Soc.bsv:              "interface Ifc_gptimer_io gptimer3_io;"
#   {board_dir}/Soc.bsv:              "interface gptimer3_io = mixed_cluster\.gptimer3_io;"
#   {board_dir}/fpga_top.v:           "output\s+gptimer3_out\s*,"
#   {board_dir}/fpga_top.v:           " wire\s+ip2intc_irpt;"
#   {board_dir}/fpga_top.v:           "\.ext_interrupts_i\(interrupts\)"
#   {board_dir}/fpga_top.v:           "IOBUF spi0_inst_sclk\(.O\(spi0_io_sclk_in_val\) ,.IO\(spi0_sclk\) ,.I\(spi0_io_sclk_out\) ,.T\(~spi0_io_sclk_outen\)\);"
#
# POST-AUDIT EXPECTATIONS (verified in {board_dir}/ after patching):
#   bsvpath:                          "ip_bsv/rtc_v1/" appended
#   {board_dir}/Soc.defines:          RTC0Base/RTC0End, RTC1Base/RTC1End defined
#   {board_dir}/Soc.defines:          MixedCluster_Num_Slaves=14, RTC0_slave_num=10, RTC1_slave_num=11, err_slave_num=13
#   {board_dir}/Soc.bsv:              import rtc_v1 :: *; added
#   {board_dir}/mixed_cluster.bsv:    import rtc_v1 :: *; added
#   {board_dir}/mixed_cluster.bsv:    interface RTCIO rtc0_io, rtc1_io; declared
#   {board_dir}/mixed_cluster.bsv:    address decoder rules for RTC0Base-RTC0End, RTC1Base-RTC1End
#   {board_dir}/mixed_cluster.bsv:    let rtc0 <- mkrtc(ext_clk); let rtc1 <- mkrtc(ext_clk); instantiated
#   {board_dir}/mixed_cluster.bsv:    (*synthesize*) module mkrtc#(Clock ext_clk) wrapper added
#   {board_dir}/mixed_cluster.bsv:    PLIC vector width incremented to 38, rtc0.rtc_sb_interrupt at index 35, rtc1.rtc_sb_interrupt at index 34
#   {board_dir}/mixed_cluster.bsv:    mkplic wrapper width param updated dynamically via {new_plic_width}
#   {board_dir}/mixed_cluster.bsv:    AXI connections for RTC0_slave_num, RTC1_slave_num wired
#   {board_dir}/mixed_cluster.bsv:    interface rtc0_io = rtc0.io; interface rtc1_io = rtc1.io; mapped
#   {board_dir}/Soc.bsv:              interface RTCIO rtc0_io, rtc1_io declared
#   {board_dir}/Soc.bsv:              interface rtc0_io = mixed_cluster.rtc0_io; interface rtc1_io = mixed_cluster.rtc1_io; wired
#   {board_dir}/fpga_top.v:           rtc0_out_pmod, rtc1_out_pmod ports declared
#   {board_dir}/fpga_top.v:           wire wire_rtc0_out, wire_rtc1_out; declared
#   {board_dir}/fpga_top.v:           .rtc0_io_rtc_clock_signal(wire_rtc0_out), .rtc1_io_rtc_clock_signal(wire_rtc1_out) mapped
#   {board_dir}/fpga_top.v:           IOBUF rtc0_io_inst, rtc1_io_inst instantiated
#   {board_dir}/fpga_top.v:           IOBUF rtc0_io_inst, rtc1_io_inst instantiated
#
# === PATCH 21: XDC CONSTRAINTS (Pre/Post) ===
# PRE-AUDIT ANCHORS:
#   {board_dir}/pin_map.yaml:         "{pin_hint}:" (target pin exists in map)
#   {board_dir}/pin_map.yaml:         "{fallback_pin}:" (fallback pin exists in map)
#   {board_dir}/constraints.xdc:      "get_ports {verilog_port_name}" NOT present (idempotency)
#
# POST-AUDIT EXPECTATIONS:
#   {board_dir}/constraints.xdc:      "set_property PACKAGE_PIN.*\[get_ports {verilog_port_name}\]" appended for each instance
#   {board_dir}/constraints.xdc:      If conflict occurred: "set_property PACKAGE_PIN.*\[get_ports {original_port}\]" for fallback