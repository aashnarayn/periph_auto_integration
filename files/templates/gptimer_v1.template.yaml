# =============================================================================
# TEMPLATE: gptimer_v1  (add direct-connected general-purpose timers, gptimer4+)
# =============================================================================
# Reuses devices/gptimer. Each instance is an mkgptimer slave in the mixed_cluster
# with a DISCRETE PLIC source. Fully instance-parametric: a 2nd added timer is
# just another entry in `instances:` (own window + own pins + own PLIC index).
# Each timer has an input-capture pin and an output pin.
# -----------------------------------------------------------------------------

- name: gptimer_v1                         # peripheral name; matches ip_bsv/gptimer_v1
  def_path: ip_bsv/gptimer_v1/gptimer_v1.yaml  # path to the IP def (gptimer has no modes)

  base_context:                            # fields shared by every instance here
    xdc_file: '{board_dir}/constraints.xdc'  # XDC file the pin constraints are written to
    gptimer_io_standard: LVCMOS12          # IO standard for the timer in/out pins

  instances:                               # one entry per added timer
  - instance_id: '4'                       # timer index -> gptimer4
    slave_id_macro: GPTimer4_slave_num     # Soc.defines macro receiving the allocated mixed-cluster slot
    base_macro: GPTimer4Base               # address-window START macro name
    base_addr: '0004_0800'                 # START address of the timer register window (hex)
    end_macro: GPTimer4End                 # address-window END macro name
    end_addr: '0004_08FF'                  # END address of the window (no overlap)
    connect_to_plic: true                  # true = interrupt -> PLIC (+1 PLICWidth); false = no PLIC source
    plic_index: 42                         # PLIC source index; used for the uniqueness / conflict check
    gptimer_in_pin: fmc_la17_cc_n          # board pin for the timer INPUT (capture) signal
    gptimer_out_pin: fmc_la18_cc_n         # board pin for the timer OUTPUT signal
    gptimer_in_fallback: fmc_la_n[06]      # pin used to route the port originally routed to gptimer_in_pin, now used by this inst
    gptimer_out_fallback: fmc_la_n[08]     # pin used to route the port originally routed to gptimer_out_pin, now used by this inst
  # - instance_id: '5'                     # add gptimer5 the same way:
  #   slave_id_macro: GPTimer5_slave_num
  #   base_macro: GPTimer5Base
  #   base_addr: '0004_0A00'               # a free window above GPTimer4End
  #   end_macro: GPTimer5End
  #   end_addr: '0004_0AFF'
  #   connect_to_plic: true
  #   plic_index: 44                       # must be unique across all peripherals
  #   gptimer_in_pin: fmc_la_p[06]
  #   gptimer_out_pin: fmc_la_n[06]
  #   gptimer_in_fallback: fmc_la_p[08]
  #   gptimer_out_fallback: fmc_la18_cc_p
