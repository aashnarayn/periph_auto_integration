- file: '{board_dir}/constraints.xdc'
  hunks:
  - find: '## - rename the used ports (in each line, after get_ports) according to the top level signal names in the project


      set_property CLOCK_DEDICATED_ROUTE BACKBONE [get_nets sys_clk_IBUF]


      set_property -dict { PACKAGE_PIN G4  IOSTANDARD LVCMOS15 } [get_ports { sys_rst }]; #IO_L12N_T1_MRCC_35 Sch=cpu_resetn


      '
    replace: '## - rename the used ports (in each line, after get_ports) according to the top level signal names in the project


      set_property CLOCK_DEDICATED_ROUTE BACKBONE [get_nets sys_clk_IBUF]

      # external_clk (AB20 = ja[3]) is a plain I/O pin, not a clock-capable (MRCC/SRCC)

      # one, but it drives a clock net (CLK_ext_clk -> gptimer0..3, and rtc0/rtc1 +

      # gptimer4 when those IPs are enabled). Vivado treats a non-CC pin sourcing a

      # clock as a placer ERROR and aborts bitstream generation; FALSE demotes it to a

      # warning and routes the net on general fabric. Needed in the pristine tree too,

      # which is why it lives in the board source rather than in any one IP def.

      set_property CLOCK_DEDICATED_ROUTE FALSE [get_nets external_clk_IBUF]


      set_property -dict { PACKAGE_PIN G4  IOSTANDARD LVCMOS15 } [get_ports { sys_rst }]; #IO_L12N_T1_MRCC_35 Sch=cpu_resetn


      '
